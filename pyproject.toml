[project]
name = "hondash"
version = "0.1.0"
description = ""
authors = [{ name = "pablobuenaposada", email = "pablo.buenaposada@gmail.com" }]
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "websockets>=17.1,<18",
    "pyusb>=1.3.1,<2",
    "jsonschema>=4.26.0,<5",
    "pandas>=3.0.5,<4",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1,<10",
    "freezegun>=1.5.5,<2",
    "ruff>=0.16.6,<0.17",
]

[tool.ruff]
target-version = "py311"
lint.select = [
    "F", # Pyflakes
    "E", # pycodestyle
    "W", # Warning
    "C90", # mccabe
    "I",  # isort
    "B", # flake8-bugbear
    "C4", # flake8-comprehensions
    "T10", # flake8-debugger
    "ISC", # flake8-implicit-str-concat
    "ICN", # flake8-import-conventions
    "PIE", # flake8-pie
    "Q", # flake8-quotes
    "SIM", # flake8-simplify
    "PGH", # pygrep-hooks
    "PLE", # Error
    "PLW", # Warning
    "RSE", # flake8-raise
    # TODO: DTZ, PT, TID, RET, ERA, PLR, TRY, UP, N
]
lint.ignore = ["E501", "SIM115", "C901", "B018"]
