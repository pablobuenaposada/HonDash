services:
  app:
    image: pablobuenaposada/hondash:latest
    environment:
      - PYTHONPATH=/app/src
    ports:
      - "5678:5678"
    networks:
      - main_network
    command: python src/bench/demo.py
    restart: unless-stopped

  nginx:
    image: nginx:latest
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf
      - ./src/devices/setup_validator/schema.json:/usr/share/nginx/html/schema.json
    networks:
      - main_network
    restart: unless-stopped

  frontend:
    build:
      context: https://github.com/pablobuenaposada/HonDash-frontend.git#main
    depends_on:
      - app
      - nginx
    ports:
      - "80:80"
    networks:
      - main_network
    restart: unless-stopped

networks:
  main_network:
    driver: bridge
